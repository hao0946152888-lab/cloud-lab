server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://mern-backend-234703-e7qr.onrender.com;
        proxy_set_header Host mern-backend-234703-e7qr.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name mern-backend-234703-e7qr.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}